[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snowflake-evolution-lab"
version = "1.0.0"
description = "A reproducible reanalysis of cellular geometry and cluster size in snowflake yeast"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "David Lindgreen" }]
keywords = ["evolution", "multicellularity", "yeast", "reproducibility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.13,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://lindgreendavid.github.io/snowflake-evolution-lab/"
Repository = "https://github.com/lindgreendavid/snowflake-evolution-lab"
Documentation = "https://github.com/lindgreendavid/snowflake-evolution-lab/blob/main/docs/protocol-v0.1.md"

[project.scripts]
snowflake-evolution = "snowflake_evolution_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snowflake_evolution_lab"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=snowflake_evolution_lab --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["snowflake_evolution_lab"]
